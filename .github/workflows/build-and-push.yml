name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "worker/**"
      - "shared/**"
      - "deploy/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tars-backend
          SHA_TAG: ${{ github.sha }}
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker
        uses: docker/build-push-action@v6
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tars-worker
          SHA_TAG: ${{ github.sha }}
        with:
          context: ./worker
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deploy:
    name: Notify T.A.R.S. of new images
    runs-on: ubuntu-latest
    needs: [build-backend, build-worker]
    continue-on-error: true

    steps:
      - name: Notify deploy endpoint
        env:
          TARS_API_URL: ${{ secrets.TARS_API_URL }}
          TARS_API_KEY: ${{ secrets.TARS_API_KEY }}
        run: |
          curl -sf -X POST "${TARS_API_URL}/api/v1/deploy" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${TARS_API_KEY}" \
            -d '{"notify_only": true}' \
            --max-time 10 || true
