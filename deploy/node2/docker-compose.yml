services:
  tars-worker:
    image: ghcr.io/t-tasin/tars-worker:latest
    container_name: tars-worker
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://100.94.4.103:6379/0}
      NODE_ROLE: muscle
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - worker-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    networks:
      - tars-net

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: tars-qdrant
    restart: unless-stopped
    # Bind to Tailscale interface only (HC-13 — never expose on 0.0.0.0).
    # 100.119.114.125 = tars2 Tailscale IP.
    ports:
      - "100.119.114.125:6333:6333"  # REST API
      - "100.119.114.125:6334:6334"  # gRPC
    volumes:
      # Bind mount on host so backups + wipes are obvious.
      # Host path must exist with appropriate ownership (uid 1000) before first up.
      - /opt/tars/qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # qdrant image has no curl/wget — use bash /dev/tcp to probe REST port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    networks:
      - tars-net

volumes:
  worker-data:
    driver: local

networks:
  tars-net:
    driver: bridge
