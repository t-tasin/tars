services:
  tars-worker:
    image: ghcr.io/t-tasin/tars-worker:latest
    container_name: tars-worker
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://100.94.4.103:6379/0}
      NODE_ROLE: muscle
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - worker-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    networks:
      - tars-net

volumes:
  worker-data:
    driver: local

networks:
  tars-net:
    driver: bridge
