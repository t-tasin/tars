services:
  tars-backend:
    image: ghcr.io/tasin/tars-backend:latest
    container_name: tars-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://tars:${POSTGRES_PASSWORD}@tars-db:5432/tars
      # Redis (Node 2)
      REDIS_URL: redis://100.119.114.125:6379/0
      # ChromaDB (Node 2)
      CHROMADB_URL: http://100.119.114.125:8200
      CHROMA_AUTH_TOKEN: ${CHROMA_AUTH_TOKEN}
      # TARS API
      TARS_API_KEY: ${TARS_API_KEY}
      ALLOWED_DEVICE_TOKENS: ${ALLOWED_DEVICE_TOKENS}
      # AI Models
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Gmail (base64-encoded OAuth JSON)
      GMAIL_PERSONAL_CREDENTIALS: ${GMAIL_PERSONAL_CREDENTIALS}
      GMAIL_PROFESSIONAL_CREDENTIALS: ${GMAIL_PROFESSIONAL_CREDENTIALS}
      # iCloud CalDAV
      ICLOUD_CALDAV_USER: ${ICLOUD_CALDAV_USER}
      ICLOUD_CALDAV_PASSWORD: ${ICLOUD_CALDAV_PASSWORD}
      # GitHub
      GITHUB_PAT: ${GITHUB_PAT}
      # Notion
      NOTION_TOKEN: ${NOTION_TOKEN}
      # Teller (Read-Only, HC-04)
      TELLER_ACCESS_TOKEN: ${TELLER_ACCESS_TOKEN}
      TELLER_CERT_PATH: ${TELLER_CERT_PATH:-/etc/tars/teller/cert.pem}
      TELLER_KEY_PATH: ${TELLER_KEY_PATH:-/etc/tars/teller/key.pem}
      TELLER_ENV: ${TELLER_ENV:-sandbox}
      # Weather
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY}
      # Picovoice
      PICOVOICE_ACCESS_KEY: ${PICOVOICE_ACCESS_KEY}
      # APNs
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_KEY_PATH: /secrets/apns-key.p8
      # Grafana / Loki
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY}
      LOKI_URL: ${LOKI_URL}
      # SerpAPI
      SERPAPI_KEY: ${SERPAPI_KEY}
      # Brave Search (MCP)
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      # System
      NODE_ROLE: brain
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
    volumes:
      - ./secrets:/secrets:ro
      - tars-data:/data
    devices:
      - /dev/snd:/dev/snd
    depends_on:
      tars-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    networks:
      - tars-net

  tars-db:
    image: postgres:16-alpine
    container_name: tars-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tars
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - tars-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - tars-backend
    networks:
      - tars-net

volumes:
  pgdata:
    driver: local
  tars-data:
    driver: local

networks:
  tars-net:
    driver: bridge
