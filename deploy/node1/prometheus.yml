global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    node: tars-brain

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: tars-backend
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8000]
        labels:
          service: tars-backend
          node: node1
