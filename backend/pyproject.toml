[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tars-backend"
version = "0.1.0"
description = "T.A.R.S. Backend — Node 1 Brain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.21.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "apscheduler>=4.0.0a5",
    "python-telegram-bot>=21.0",
    "google-generativeai>=0.8.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "caldav>=1.4.0",
    "plaid-python>=26.0.0",
    "notion-client>=2.0",
    "redis>=5.0",
    "pvporcupine>=3.0",
    "pyaudio>=0.2.14",
    "openai-whisper>=20231117",
    "pyatv>=0.14.0",
    "pyttsx3>=2.90",
    "apns2>=0.9.0",
    "apprise>=1.9.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx",
    "ruff>=0.8.0",
    "mypy>=1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
