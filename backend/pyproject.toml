[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tars-backend"
version = "0.1.0"
description = "T.A.R.S. Backend — Node 1 Brain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.21.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "apscheduler>=3.10,<4",
    "python-telegram-bot>=21.0",
    "google-genai>=1.0",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "caldav>=1.4.0",
    "notion-client>=2.0",
    "redis>=5.0",
    "pvporcupine>=3.0",
    "pyaudio>=0.2.14",
    "openai-whisper>=20231117",
    "pyatv>=0.14.0",
    "pyttsx3>=2.90",
    "gTTS>=2.5.0",
    "aioapns>=4.0",
    "apprise>=1.9.0",
    "cryptography>=42.0",
    "psutil>=6.0",
    "python-jobspy>=1.1.0",
    "python-multipart>=0.0.9",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "httpx",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "fakeredis>=2.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated migrations keep the raw SQL / column-spec lines long
"alembic/versions/*" = ["E501"]
# Test fixtures intentionally contain long literals and module-level mock installs
"tests/*" = ["E501", "F841", "N806", "E402"]
# Agent prompt strings intentionally long
"src/agents/briefing.py" = ["E501"]
"src/agents/daily_life.py" = ["E501"]
"src/agents/email_classifier.py" = ["E501"]
"src/agents/workout_tracker.py" = ["E501"]
# Scheduler cron specs + job descriptions hit the limit
"src/scheduler/jobs.py" = ["E501"]
# Job-board scrapers embed long URL / regex literals
"src/integrations/job_boards/*" = ["E501"]
# wardrobe.py uses the sys.modules router-registration hack before the last import
"src/api/wardrobe.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.mypy]
python_version = "3.12"
strict = true
