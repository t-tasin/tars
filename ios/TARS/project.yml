name: TARS
options:
  bundleIdPrefix: com.tasin.tars
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""

configs:
  Debug:
    buildSettings:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  Release:
    buildSettings:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  TARS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TARS
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: TARS/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tasin.tars
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: false
    entitlements:
      path: TARS/Resources/TARS.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.tasin.tars

  TARSWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TARSWatch
        excludes:
          - "**/.DS_Store"
          - "**/Complications/**"
    settings:
      base:
        INFOPLIST_FILE: TARSWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tasin.tars.watchapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: false
    entitlements:
      path: TARSWatch/TARSWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tasin.tars
    dependencies:
      - target: TARS
        embed: false
      - target: TARSWatchComplication
        embed: true

  TARSWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: TARSWatch/Complications
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tasin.tars.watchapp.complication
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
    entitlements:
      path: TARSWatch/TARSWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tasin.tars
    dependencies:
      - target: TARSWatch
        embed: false

  TARSWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TARSWidgetExtension
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: TARSWidgetExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tasin.tars.widget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: TARS
        embed: false

schemes:
  TARS:
    build:
      targets:
        TARS: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  TARSWatch:
    build:
      targets:
        TARSWatch: all
        TARSWatchComplication: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
