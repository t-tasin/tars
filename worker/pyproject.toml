[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tars-worker"
version = "0.1.0"
description = "T.A.R.S. Worker — Node 2 Muscle"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "docker>=7.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0",
    "python-jobspy>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
